name: Java CI with Gradle

on:
  push:
    branches: [ "main", "latest" ]
  pull_request:
    branches: [ "main", "latest" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo_extracted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        # Only the 1.21.11 version is maintained and used; skip the 26.x
        # multi-version builds to keep CI fast.
        run: ./gradlew :1.21.11:build

      - name: Stage release jar
        run: |
          JAR=$(find versions/1.21.11/build/libs -name "echo-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            JAR=$(find versions -path "*/build/libs/echo-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" 2>/dev/null | head -1)
          fi
          if [ -z "$JAR" ]; then
            echo "No jar found" >&2
            exit 1
          fi
          cp "$JAR" echo-latest.jar
          ls -la echo-latest.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-mod
          path: echo_extracted/echo-latest.jar

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b0.0.6
          name: Echo Client b0.0.6
          body: |
            Automated build from main.

            - Authentication removed
            - AutoAnchor: SmartAutoAnchor port (POV-aware anchor cycling, safe glowstone placement, strict/fast server timing)
            - Totem Hand: AutoDoubleHand port (pop/kill double-hand, crystal & sword damage prediction)
            - AutoCrystal: fixed obsidian double-placement when Place Obsidian is enabled
          files: echo_extracted/echo-latest.jar
          fail_on_unmatched_files: false
          allowUpdates: true
          make_latest: true
