name: Java CI with Gradle

on:
  push:
    branches: [ "main", "latest" ]
  pull_request:
    branches: [ "main", "latest" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Stage release jar
        run: |
          find build/libs -name "echo-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} echo-latest.jar \;

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-mod
          path: echo-latest.jar

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b0.0.6
          name: Echo Client b0.0.6
          body: |
            Automated build from main.

            - Authentication removed
            - AutoAnchor: SmartAutoAnchor port (POV-aware anchor cycling, safe glowstone placement, strict/fast server timing)
            - Totem Hand: AutoDoubleHand port (pop/kill double-hand, crystal & sword damage prediction)
            - AutoCrystal: fixed obsidian double-placement when Place Obsidian is enabled
          files: echo-latest.jar
          fail_on_unmatched_files: false
          allowUpdates: true
          make_latest: true
