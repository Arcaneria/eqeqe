name: Build Stegered Client

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stegered-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^client_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r' | xargs)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid client_version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match client_version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Package build
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          source_jar="client/build/libs/stegered-client-${version}.jar"
          output_jar="release/Stegered-Client-${version}.jar"
          test -f "$source_jar"
          mkdir -p release
          cp "$source_jar" "$output_jar"
          (cd release && sha256sum "Stegered-Client-${version}.jar" > "Stegered-Client-${version}.jar.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stegered-Client-${{ steps.version.outputs.version }}
          path: |
            release/Stegered-Client-${{ steps.version.outputs.version }}.jar
            release/Stegered-Client-${{ steps.version.outputs.version }}.jar.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    # Auto-release on every push to main (when client_version changed) and on
    # explicit v* tag pushes / manual dispatch on the main branch.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Stegered-Client-${{ needs.build.outputs.version }}
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          # Never clobber an existing release (idempotent pushes).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          # A stale tag without a release (e.g. from an aborted run) blocks
          # creation; drop it so the release can point at the new commit.
          if gh api "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}"
          fi

          CREATE_ARGS=(--title "Stegered Client ${VERSION}" --generate-notes)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CREATE_ARGS+=(--verify-tag)
          else
            CREATE_ARGS+=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" \
            "release/Stegered-Client-${VERSION}.jar" \
            "release/Stegered-Client-${VERSION}.jar.sha256" \
            "${CREATE_ARGS[@]}"
